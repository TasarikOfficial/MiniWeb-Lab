<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Orbit</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#07080b;color:#f7f7f5;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{position:relative;width:min(820px,94vw);height:min(620px,78vh);border:1px solid #ffffff18;border-radius:32px;background:radial-gradient(circle at 50% 45%,#20242c 0,#101217 36%,#090a0d 72%);box-shadow:0 40px 100px #0009;overflow:hidden}.copy{position:absolute;left:28px;top:26px;z-index:4}.copy b{font-size:13px;letter-spacing:.16em;text-transform:uppercase}.copy p{margin:8px 0 0;color:#9ba0aa;font-size:13px}.core{position:absolute;left:50%;top:50%;width:86px;height:86px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:#f5f6f2;color:#090a0d;font-weight:800;box-shadow:0 0 50px #fff3;z-index:3}.ring{position:absolute;left:50%;top:50%;border:1px solid #ffffff20;border-radius:50%;transform:translate(-50%,-50%)}.r1{width:210px;height:210px}.r2{width:350px;height:350px}.r3{width:500px;height:500px}.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff9;transform:translate(-50%,-50%);transition:width .15s,height .15s}.pulse{position:absolute;border:1px solid #fff7;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse .9s ease-out forwards}@keyframes pulse{from{width:8px;height:8px;opacity:1}to{width:150px;height:150px;opacity:0}}.hint{position:absolute;right:24px;bottom:22px;color:#777e89;font-size:12px}@media(max-width:600px){.panel{height:72vh}.r3{width:420px;height:420px}.copy{left:20px;top:20px}}
</style></head>
<body><main class="wrap"><section class="panel" id="panel"><div class="copy"><b>Signal Orbit</b><p>Move to bend the system. Tap to send a signal.</p></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core">LIVE</div><div class="hint">pointer / touch</div></section></main>
<script>
const panel=document.querySelector('#panel');const rings=[105,175,250];const dots=[];for(let r=0;r<3;r++)for(let i=0;i<5;i++){const d=document.createElement('i');d.className='dot';panel.appendChild(d);dots.push({el:d,ring:r,a:i/5*Math.PI*2+Math.random()});}
let px=.5,py=.5,t=0;function frame(){t+=.008;const w=panel.clientWidth,h=panel.clientHeight,cx=w/2+(px-.5)*22,cy=h/2+(py-.5)*22;dots.forEach((d,i)=>{const a=d.a+t*(d.r%2?-.8:1)*(1+d.r*.18);const rr=Math.min(rings[d.r],Math.min(w,h)*(.19+d.r*.13));d.el.style.left=(cx+Math.cos(a)*rr)+'px';d.el.style.top=(cy+Math.sin(a)*rr)+'px';const s=8+d.r*2;d.el.style.width=s+'px';d.el.style.height=s+'px'});requestAnimationFrame(frame)}frame();panel.addEventListener('pointermove',e=>{const b=panel.getBoundingClientRect();px=(e.clientX-b.left)/b.width;py=(e.clientY-b.top)/b.height});panel.addEventListener('pointerleave',()=>{px=py=.5});panel.addEventListener('pointerdown',e=>{const b=panel.getBoundingClientRect(),p=document.createElement('span');p.className='pulse';p.style.left=(e.clientX-b.left)+'px';p.style.top=(e.clientY-b.top)+'px';panel.appendChild(p);setTimeout(()=>p.remove(),950)});
</script></body></html>
