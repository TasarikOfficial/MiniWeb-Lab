<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Trails</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080d;color:#f7f7fb;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}.card{text-align:center;padding:28px;transition:.35s;mix-blend-mode:screen}.card.hide{opacity:.18;transform:scale(.98)}h1{font-size:clamp(3rem,10vw,8rem);letter-spacing:-.07em;margin:0;line-height:.8}p{opacity:.58;margin:20px 0 0;font-size:clamp(.9rem,2vw,1.05rem)}.badge{position:fixed;top:22px;left:22px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.55}.hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.4;white-space:nowrap}@media(max-width:600px){.badge{top:16px;left:16px}.hint{bottom:16px}}</style></head><body><canvas id="c"></canvas><div class="badge">MiniWeb Lab / 04</div><div class="ui"><div class="card" id="card"><h1>Light<br>Trails</h1><p>Move. Draw. Let it disappear.</p></div></div><div class="hint">pointer / touch · double tap to clear</div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),card=document.querySelector('#card');let dpr=1,w=0,h=0,pts=[],hue=210,last=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);function add(px,py){const now=performance.now();if(now-last<8)return;last=now;hue=(hue+2.5)%360;pts.push({x:px,y:py,t:now,h:hue});if(pts.length>180)pts.shift();card.classList.add('hide')}addEventListener('pointermove',e=>add(e.clientX,e.clientY));addEventListener('pointerdown',e=>add(e.clientX,e.clientY));addEventListener('dblclick',()=>pts=[]);let timer;addEventListener('pointermove',()=>{clearTimeout(timer);timer=setTimeout(()=>card.classList.remove('hide'),900)});function frame(now){x.fillStyle='rgba(7,8,13,.13)';x.fillRect(0,0,w,h);pts=pts.filter(p=>now-p.t<1500);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],age=(now-b.t)/1500,alpha=Math.max(0,1-age);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineCap='round';x.lineWidth=1+alpha*9;x.strokeStyle=`hsla(${b.h},90%,65%,${alpha*.7})`;x.shadowBlur=18*alpha;x.shadowColor=`hsla(${b.h},100%,70%,${alpha})`;x.stroke()}x.shadowBlur=0;requestAnimationFrame(frame)}requestAnimationFrame(frame)</script></body></html>
