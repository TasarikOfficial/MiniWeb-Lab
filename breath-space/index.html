<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breath Space</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:#07090d;color:#f7f8fb}.glow{position:fixed;width:55vmax;height:55vmax;border-radius:50%;background:radial-gradient(circle,rgba(124,255,194,.14),transparent 65%);filter:blur(12px);transition:transform 4s cubic-bezier(.4,0,.2,1)}main{text-align:center;padding:24px;position:relative;z-index:1}.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8d96a8;margin-bottom:32px}.orb{width:min(52vw,280px);aspect-ratio:1;border-radius:50%;margin:auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d9fff0 0,#7cffc2 12%,#1a7451 42%,#0b241b 70%);box-shadow:0 0 70px rgba(124,255,194,.2),inset -18px -24px 45px rgba(0,0,0,.4);transform:scale(.72);transition:transform 4s cubic-bezier(.4,0,.2,1),filter .5s}.orb span{font-size:14px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:#06130d}.orb.inhale{transform:scale(1)}.orb.hold{transform:scale(1)}h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.055em;margin:38px 0 8px}p{margin:0 auto;color:#929aaa;max-width:420px;line-height:1.6;font-size:14px}.controls{margin-top:24px;display:flex;justify-content:center;gap:10px}button{border:1px solid #252a34;background:#11141a;color:#f7f8fb;padding:11px 17px;border-radius:999px;font:inherit;cursor:pointer}button:hover{background:#191d25}.time{margin-top:18px;color:#596170;font-variant-numeric:tabular-nums;font-size:12px}@media(max-width:520px){.eyebrow{margin-bottom:24px}.orb{width:62vw}h1{margin-top:30px}}
</style>
</head>
<body><div class="glow" id="glow"></div><main><div class="eyebrow">60 second reset</div><div class="orb" id="orb"><span id="cue">Ready</span></div><h1>Breath Space</h1><p>A tiny guided breathing break. Four seconds in, four seconds hold, four seconds out.</p><div class="controls"><button id="start">Start</button><button id="reset">Reset</button></div><div class="time" id="time">01:00</div></main>
<script>
const orb=document.querySelector('#orb'),cue=document.querySelector('#cue'),time=document.querySelector('#time'),start=document.querySelector('#start'),reset=document.querySelector('#reset'),glow=document.querySelector('#glow');let timer=null,elapsed=0,running=false;const phases=[['Inhale','inhale'],['Hold','hold'],['Exhale','']];function render(){const phase=Math.floor(elapsed/4)%3;cue.textContent=phases[phase][0];orb.className='orb '+phases[phase][1];glow.style.transform=`scale(${phase===0?1.12:phase===1?1.12:.82})`;time.textContent='00:'+String(Math.max(0,60-elapsed)).padStart(2,'0')}function stop(){clearInterval(timer);timer=null;running=false;start.textContent='Start'}start.onclick=()=>{if(running){stop();return}running=true;start.textContent='Pause';render();timer=setInterval(()=>{elapsed++;if(elapsed>=60){elapsed=60;render();stop();cue.textContent='Done';orb.className='orb inhale';return}render()},1000)};reset.onclick=()=>{stop();elapsed=0;cue.textContent='Ready';orb.className='orb';glow.style.transform='scale(1)';time.textContent='01:00'};
</script></body></html>
