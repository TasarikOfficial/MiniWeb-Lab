<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinetic Type</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fafafa;font-family:system-ui,sans-serif}.wrap{min-height:100svh;display:grid;place-items:center;padding:24px}main{text-align:center}.tag{letter-spacing:.18em;text-transform:uppercase;color:#a1a1aa;font-size:12px}.word{margin:24px 0;font-size:clamp(70px,18vw,190px);font-weight:900;line-height:.8;letter-spacing:-.08em;display:flex;justify-content:center;perspective:700px}.word span{display:inline-block;transition:transform .15s ease;transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--dy))}.sub{color:#a1a1aa}button{margin-top:20px;border:1px solid #3f3f46;background:#18181b;color:white;padding:11px 18px;border-radius:999px}</style></head><body><div class="wrap"><main><div class="tag">Interactive typography</div><div class="word" id="word"></div><p class="sub">Move your pointer. Watch the letters lean into motion.</p><button id="swap">Change word</button></main></div><script>const words=['MOVE','TYPE','FLOW','PLAY'];let n=0,w=document.querySelector('#word');function draw(){w.innerHTML=[...words[n]].map(c=>'<span>'+c+'</span>').join('')}draw();addEventListener('pointermove',e=>{let x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;[...w.children].forEach((s,i)=>{s.style.setProperty('--rx',(-y*22)+'deg');s.style.setProperty('--ry',(x*28)+'deg');s.style.setProperty('--dy',(Math.sin(x*5+i)*8)+'px')})});document.querySelector('#swap').onclick=()=>{n=(n+1)%words.length;draw()}</script></body></html>
