<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilt Card</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#08090c;color:#fff;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.glow{position:fixed;width:55vmax;height:55vmax;border-radius:50%;background:radial-gradient(circle,var(--accent,#7c5cff) 0%,transparent 65%);opacity:.18;filter:blur(35px);pointer-events:none;transform:translate(-50%,-50%)}main{text-align:center;padding:24px;perspective:1000px}.card{width:min(78vw,390px);aspect-ratio:1.55;border:1px solid #ffffff28;border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:linear-gradient(135deg,#ffffff18,#ffffff08);box-shadow:0 35px 90px #0008;backdrop-filter:blur(18px);transform-style:preserve-3d;transition:transform .12s ease-out,background .4s}.card:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#ffffff40,transparent 38%);pointer-events:none}.mark{font-size:14px;letter-spacing:.18em;text-transform:uppercase;opacity:.65;transform:translateZ(28px)}h1{font-size:clamp(38px,9vw,68px);line-height:.9;margin:0;letter-spacing:-.06em;transform:translateZ(48px)}.foot{display:flex;justify-content:space-between;align-items:end;transform:translateZ(32px)}.dot{width:13px;height:13px;border-radius:50%;background:var(--accent,#7c5cff);box-shadow:0 0 24px var(--accent,#7c5cff)}p{margin:22px 0 0;color:#ffffff8c;font-size:13px}.reset{margin-top:16px;border:1px solid #ffffff24;background:#ffffff0d;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer} @media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head>
<body><div class="glow" id="glow"></div><main><div class="card" id="card"><div class="mark">MiniWeb / 05</div><h1>TILT<br>CARD</h1><div class="foot"><span>Move to bend light.</span><i class="dot"></i></div></div><p>Move your pointer · tap to change the accent</p><button class="reset" id="reset">Center</button></main>
<script>
const card=document.querySelector('#card'),glow=document.querySelector('#glow'),root=document.documentElement;const colors=['#7c5cff','#35e7a5','#ff5f7a','#56b8ff','#ffbf4b'];let ci=0;
function move(e){const r=card.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top)),rx=(.5-y/r.height)*14,ry=(x/r.width-.5)*18;card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;card.style.setProperty('--x',`${x/r.width*100}%`);card.style.setProperty('--y',`${y/r.height*100}%`);glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px'}
addEventListener('pointermove',move,{passive:true});card.addEventListener('click',()=>{ci=(ci+1)%colors.length;root.style.setProperty('--accent',colors[ci])});document.querySelector('#reset').onclick=()=>{card.style.transform='rotateX(0) rotateY(0)';card.style.setProperty('--x','50%');card.style.setProperty('--y','50%')};
</script></body></html>
