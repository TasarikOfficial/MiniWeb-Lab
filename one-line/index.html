<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Line — tiny drawing challenge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f4f5f7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;overflow:hidden}.top{position:fixed;inset:0 0 auto;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:22px 26px;pointer-events:none}.brand{font-weight:800;letter-spacing:-.04em;font-size:clamp(22px,4vw,42px)}.meta{font:600 12px ui-monospace,SFMono-Regular,monospace;color:#9ca3af;letter-spacing:.12em;text-transform:uppercase}.stage{height:100vh;display:grid;place-items:center;padding:88px 18px 28px}.card{width:min(900px,100%);height:min(64vh,620px);position:relative;border:1px solid #292c33;border-radius:28px;background:radial-gradient(circle at 50% 45%,#171a21 0,#0d0f14 62%,#0a0b0e 100%);box-shadow:0 35px 100px #0008;overflow:hidden;touch-action:none;cursor:crosshair}canvas{width:100%;height:100%;display:block}.hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transition:.25s}.hint h1{margin:0;font-size:clamp(38px,8vw,92px);line-height:.88;letter-spacing:-.075em}.hint p{color:#8e949f;margin:18px 0 0;font-size:14px}.badge{position:absolute;left:18px;bottom:18px;border:1px solid #30343c;background:#101218cc;backdrop-filter:blur(10px);border-radius:999px;padding:9px 13px;font:700 11px ui-monospace,monospace;letter-spacing:.08em;color:#b8bec8}.reset{position:absolute;right:18px;bottom:18px;border:0;border-radius:999px;background:#d7ff45;color:#0a0b0d;padding:11px 16px;font-weight:850;cursor:pointer;transform:translateY(70px);transition:.25s}.reset.show{transform:none}.drawing .hint{opacity:0;transform:scale(.98)}@media(max-width:600px){.top{padding:18px}.stage{padding-inline:12px}.card{height:70vh;border-radius:22px}}
</style></head><body><header class="top"><div class="brand">ONE LINE</div><div class="meta">don't lift · don't stop</div></header><main class="stage"><section class="card" id="card"><canvas id="c"></canvas><div class="hint"><div><h1>Draw something.<br>One stroke only.</h1><p>Press anywhere and keep moving.</p></div></div><div class="badge" id="badge">READY</div><button class="reset" id="reset">Again ↗</button></section></main>
<script>
const card=document.querySelector('#card'),c=document.querySelector('#c'),x=c.getContext('2d'),badge=document.querySelector('#badge'),reset=document.querySelector('#reset');let on=false,done=false,last=null,dist=0,start=0;
function size(){let r=card.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);x.lineCap=x.lineJoin='round'}size();addEventListener('resize',()=>{if(!on&&!done)size()});
function p(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
card.addEventListener('pointerdown',e=>{if(done)return;on=true;start=performance.now();dist=0;last=p(e);card.classList.add('drawing');card.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(last.x,last.y);badge.textContent='DRAWING';});
card.addEventListener('pointermove',e=>{if(!on)return;let q=p(e),dx=q.x-last.x,dy=q.y-last.y;dist+=Math.hypot(dx,dy);let hue=(dist*.16)%360;x.strokeStyle=`hsl(${hue} 95% 67%)`;x.shadowColor=`hsl(${hue} 95% 58%)`;x.shadowBlur=16;x.lineWidth=5;x.lineTo(q.x,q.y);x.stroke();x.beginPath();x.moveTo(q.x,q.y);last=q;badge.textContent=Math.round(dist)+' PX';});
function finish(){if(!on)return;on=false;done=true;badge.textContent=(dist/100).toFixed(1)+'M · '+((performance.now()-start)/1000).toFixed(1)+'S';reset.classList.add('show')}
card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);
reset.onclick=e=>{e.stopPropagation();done=false;on=false;last=null;reset.classList.remove('show');card.classList.remove('drawing');size();x.clearRect(0,0,c.width,c.height);badge.textContent='READY'};
</script></body></html>
