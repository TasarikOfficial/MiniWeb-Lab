<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Bloom</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><span class="mark">✦</span><span>PIXEL BLOOM</span><button id="reset">Reset</button></header>
  <section class="hero">
    <p class="eyebrow">A tiny digital garden</p>
    <h1>Click anywhere.<br><em>Grow something.</em></h1>
    <p class="sub">Every click plants a one-of-a-kind geometric bloom. No accounts. No API. Just a calm little canvas.</p>
    <div class="stats"><span><b id="count">0</b> blooms</span><span>∞ combinations</span><span>0 dependencies</span></div>
  </section>
  <section id="garden" aria-label="Interactive garden"><div class="hint">tap the garden ↓</div></section>
</main>
<script src="script.js"></script>
</body></html>
