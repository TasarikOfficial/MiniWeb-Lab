<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Cursor</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07070a;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{height:100svh;display:grid;place-items:center;position:relative}.grid{position:absolute;inset:-10%;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:42px 42px;transform:perspective(700px) rotateX(58deg) translateY(25%)}h1{font-size:clamp(3rem,11vw,9rem);letter-spacing:-.07em;margin:0;position:relative;z-index:2}.sub{position:absolute;bottom:7%;opacity:.55;letter-spacing:.16em;text-transform:uppercase;font-size:.7rem}.prism{position:fixed;width:120px;height:120px;left:0;top:0;pointer-events:none;z-index:3;transform:translate(-50%,-50%);filter:blur(.2px)}.prism:before,.prism:after{content:"";position:absolute;inset:0;border:1px solid #ffffff40;clip-path:polygon(50% 0,100% 100%,0 100%);background:conic-gradient(from 210deg,#ff2d9566,#00e5ff55,#ffe60055,#ff2d9566);mix-blend-mode:screen}.prism:after{transform:scale(.72) rotate(180deg);filter:blur(7px)}.beam{position:fixed;height:1px;width:34vw;transform-origin:left center;pointer-events:none;background:linear-gradient(90deg,#fff8,transparent);opacity:.35}@media(pointer:coarse){.prism{width:90px;height:90px}}</style></head><body><main class="wrap"><div class="grid"></div><h1>PRISM</h1><div class="sub">move · bend · refract</div></main><div class="prism" id="p"></div><div class="beam" id="b"></div><script>const p=document.querySelector('#p'),b=document.querySelector('#b');let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y;addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY});addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;p.animate([{scale:1},{scale:1.28},{scale:1}],{duration:320})});function loop(){x+=(tx-x)*.13;y+=(ty-y)*.13;p.style.left=x+'px';p.style.top=y+'px';const dx=innerWidth/2-x,dy=innerHeight/2-y;b.style.left=x+'px';b.style.top=y+'px';b.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;requestAnimationFrame(loop)}loop()</script></body></html>
