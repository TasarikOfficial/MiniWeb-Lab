<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Tiny Weather</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{margin:0;font-family:system-ui;background:#eaf4ff;color:#10223b}#root{min-height:100vh;display:grid;place-items:center}.card{width:min(420px,80vw);padding:32px;background:#fff;border-radius:30px;box-shadow:0 24px 70px #3974a72b}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccdbea;border-radius:14px}.temp{font-size:72px;font-weight:700;margin:24px 0 0}</style></head><body><div id="root"></div><script type="text/babel">const cities={istanbul:[24,'Sunny'],canakkale:[22,'Breezy'],ankara:[19,'Cloudy'],izmir:[27,'Clear']};function App(){const[q,setQ]=React.useState('canakkale');const d=cities[q.toLowerCase()]||[21,'Demo weather'];return <div className="card"><h1>Tiny Weather</h1><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search city"/><p className="temp">{d[0]}°</p><p>{d[1]} · Demo data</p></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
