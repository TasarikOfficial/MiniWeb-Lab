<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Gradient Studio</title><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><style>body{margin:0;font-family:system-ui;background:#09090b;color:#fff}#app{min-height:100vh;display:grid;place-items:center}.card{width:min(700px,85vw);padding:28px;border:1px solid #ffffff1c;border-radius:28px;background:#18181b}.preview{height:280px;border-radius:20px;margin:20px 0;box-shadow:0 20px 80px #0008}.row{display:flex;gap:18px;align-items:center}input{width:60px;height:42px;border:0;background:none}button{padding:12px 18px;border:0;border-radius:12px;font-weight:700}</style></head><body><div id="app"><div class="card"><h1>Gradient Studio</h1><div class="row"><input type="color" v-model="a"><input type="color" v-model="b"><span>{{css}}</span></div><div class="preview" :style="{background:css}"></div><button @click="copy">Copy CSS</button></div></div><script>Vue.createApp({data:()=>({a:'#0a84ff',b:'#a855f7'}),computed:{css(){return `linear-gradient(135deg, ${this.a}, ${this.b})`}},methods:{copy(){navigator.clipboard.writeText('background: '+this.css)}}}).mount('#app')</script></body></html>
